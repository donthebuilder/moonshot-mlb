# RELEASE TRAIN (2026-10-20, Donovan: "merge in batches ... even more if possible").
# Every merge to main used to be one Vercel production build (~35 a day, Build CPU the biggest line on the bill).
# Now Vercel's production branch is `release`, and this job moves `release` up to `main` three times a day, so a
# day's merges ship as ~3 builds. main itself no longer builds (scripts/vercel-ignore.sh skips non-production).
#
#   scheduled   15:10, 20:10, 01:10 UTC (8:10 am, 1:10 pm, 6:10 pm Arizona) -- only when main is ahead
#   right now   Actions tab -> "Release train" -> Run workflow (works from the GitHub phone app)
#               or put [ship now] in a commit / PR title merged to main
#
# Fast-forward only: if `release` ever holds a commit main doesn't, the job fails loudly instead of overwriting it.
# Undo: Vercel -> Project -> Settings -> Git -> Production Branch back to `main`, and delete this file.
name: Release train
on:
  schedule:
    - cron: '10 15,20 * * *'
    - cron: '10 1 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-train
  cancel-in-progress: false
jobs:
  ship:
    runs-on: ubuntu-latest
    # on a push, only when the newest commit asks for it
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[ship now]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release up to main (fast-forward only)
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN=$(git rev-parse origin/main)
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch origin release
            REL=$(git rev-parse origin/release)
          else
            REL=""
          fi
          if [ "$MAIN" = "$REL" ]; then echo "release is already at main ($MAIN) -- nothing to ship"; exit 0; fi
          if [ -n "$REL" ] && ! git merge-base --is-ancestor "$REL" "$MAIN"; then
            echo "::error::release has commits main doesn't ($REL) -- not overwriting; fix by hand"; exit 1
          fi
          echo "shipping $(git rev-list --count ${REL:+$REL..}$MAIN) commit(s): ${REL:-<new>} -> $MAIN"
          git log --oneline ${REL:+$REL..}$MAIN | head -20
          git push origin "$MAIN:refs/heads/release"
